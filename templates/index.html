{% extends "base.html" %}
{% block title %}Nova Cotação — Blend Seguros{% endblock %}
{% block content %}
<h1>Blend Seguros — Nova Cotação</h1>
<div class="card">
  <h2>Dados do Cliente</h2>
  <form method="post" action="/cotar" onsubmit="return validarForm(this)">
    <div class="grid-2" style="margin-bottom:16px">
      <div>
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" required placeholder="João da Silva">
      </div>
      <div>
        <label for="nascimento">Data de nascimento</label>
        <input id="nascimento" name="nascimento" type="text" required placeholder="DD/MM/AAAA">
      </div>
    </div>
    <div class="grid-2" style="margin-bottom:16px">
      <div>
        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" type="text" placeholder="000.000.000-00">
      </div>
      <div>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="joao@email.com">
      </div>
    </div>
    <div class="grid-2" style="margin-bottom:16px">
      <div>
        <label for="telefone">Telefone / WhatsApp</label>
        <input id="telefone" name="telefone" type="text" placeholder="(11) 99999-9999">
      </div>
      <div>
        <label for="renda">Renda mensal (R$)</label>
        <input id="renda" name="renda" type="number" value="5000" min="1000" step="500">
      </div>
    </div>
    <div class="grid-3" style="margin-bottom:24px">
      <div>
        <label for="sexo">Sexo</label>
        <select id="sexo" name="sexo">
          <option value="M">Masculino</option>
          <option value="F">Feminino</option>
        </select>
      </div>
      <div>
        <label for="profissao">Profissão</label>
        <input id="profissao" name="profissao" type="text" value="Advogado" placeholder="Ex: Médico, Engenheiro...">
      </div>
      <div>
        <label for="ocupacao">Ocupação</label>
        <select id="ocupacao" name="ocupacao">
          <option value="Profissional Liberal">Profissional Liberal</option>
          <option value="Assalariado">Assalariado</option>
          <option value="Empresário">Empresário</option>
          <option value="Autônomo">Autônomo</option>
          <option value="Aposentado">Aposentado</option>
        </select>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Cotar nas 3 seguradoras</button>
  </form>
</div>
<script>
function cpfValido(cpf) {
  var d = cpf.replace(/\D/g, '');
  if (d.length !== 11) return false;
  if (/^(\d)\1+$/.test(d)) return false;
  for (var i = 9; i <= 10; i++) {
    var soma = 0;
    for (var j = 0; j < i; j++) soma += parseInt(d[j]) * (i + 1 - j);
    var r = (soma * 10) % 11;
    if (r === 10) r = 0;
    if (r !== parseInt(d[i])) return false;
  }
  return true;
}
function validarForm(form) {
  var cpf = form.cpf.value.trim();
  if (cpf && !cpfValido(cpf)) {
    alert('CPF inválido. O MAG Seguros valida o CPF — use um CPF válido para gerar cotações.');
    form.cpf.focus();
    return false;
  }
  return true;
}
</script>
{% endblock %}
