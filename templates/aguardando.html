{% extends "base.html" %}
{% block title %}Aguardando — Blend Seguros{% endblock %}
{% block head %}
<meta http-equiv="refresh" content="5; url=/aguardando/{{ job_id }}">
{% endblock %}
{% block content %}
<div class="card" style="text-align:center; padding:48px 28px">
  <h1 style="margin-bottom:16px">Consultando seguradoras...</h1>
  <p style="color:#666; font-size:1.05rem; margin-bottom:24px">{{ msg }}</p>
  <div style="display:inline-block; width:40px; height:40px; border:4px solid #e0e0e0; border-top-color:#0057ff; border-radius:50%; animation:spin 1s linear infinite;"></div>
  <p style="margin-top:20px; color:#aaa; font-size:.85rem">Essa página atualiza automaticamente a cada 5 segundos.</p>
</div>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
{% endblock %}
