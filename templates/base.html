<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Blend Seguros{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.6rem; margin-bottom: 24px; color: #1a1a1a; }
    h2 { font-size: 1.2rem; margin-bottom: 16px; color: #333; }
    .card { background: #fff; border-radius: 8px; padding: 28px; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 24px; }
    .btn { display: inline-block; padding: 10px 24px; border-radius: 6px; border: none; cursor: pointer; font-size: 1rem; font-weight: 600; text-decoration: none; }
    .btn-primary { background: #0057ff; color: #fff; }
    .btn-primary:hover { background: #0047d4; }
    .btn-secondary { background: #e0e0e0; color: #222; }
    label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: 4px; color: #444; }
    input, select { width: 100%; padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    input:focus, select:focus { outline: 2px solid #0057ff; border-color: #0057ff; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    @media(max-width:600px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th { background: #f0f0f0; padding: 10px 12px; text-align: left; font-weight: 600; }
    td { padding: 9px 12px; border-bottom: 1px solid #eee; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: .75rem; font-weight: 700; }
    .badge-ok { background: #d4f5e0; color: #1a7a40; }
    .badge-err { background: #fde8e8; color: #9b1c1c; }
    .tag { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-right: 4px; text-transform: uppercase; }
    .tag-azos { background: #dbeafe; color: #1e40af; }
    .tag-mag  { background: #fef3c7; color: #92400e; }
    .tag-omint{ background: #ede9fe; color: #5b21b6; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
